<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Android Linux</title>
    <link rel="icon" type="image/png" href="./com.android/ic_launcher.png">
      <link rel="apple-touch-icon" href="./com.android/ic_launcher.png">
  <style>
    * { box-sizing: border-box; }

    :root {
      --top: calc(34px + env(safe-area-inset-top, 0px));
      --bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,.30)),
        url("./com.android/wallpaper.jpg") center center / cover no-repeat;
      position: relative;
      user-select: none;
    }

    /* Tiroir de notifications */
    .notification-drawer {
      position: fixed;
      z-index: 40;
      top: 0;
      left: 0;
      right: 0;
      height: min(72vh, 620px);
      padding: max(12px, env(safe-area-inset-top)) 22px 28px;
      background: rgba(20, 24, 27, .94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 0 0 24px 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,.38);
      transform: translateY(-105%);
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
      display: flex;
      flex-direction: column;
      color: #fff;
      overflow-y: auto;
    }

    .notification-drawer.open {
      transform: translateY(0);
    }

    .drawer-handle {
      width: 42px;
      height: 4px;
      margin: 4px auto 18px;
      border-radius: 10px;
      background: rgba(255,255,255,.42);
      flex-shrink: 0;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      flex-shrink: 0;
    }

    .drawer-header > span:first-child {
      font-size: 24px;
      font-weight: 500;
    }

    .drawer-title {
      flex: 1;
      opacity: .7;
    }

    .close-drawer {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    /* Notification Termux Android Style */
    .notification-card {
      background: #f4f6f6;
      color: #191c1d;
      border-radius: 24px;
      padding: 16px 20px;
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    .notif-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #3f484a;
    }

    .notif-app-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .notif-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #3e636d;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: bold;
      font-family: monospace;
    }

    .notif-chevron {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.05);
      display: grid;
      place-items: center;
      font-size: 12px;
      color: #191c1d;
    }

    .notif-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-left: 36px;
    }

    .notif-title {
      font-size: 18px;
      font-weight: 600;
      color: #191c1d;
    }

    .notif-sub {
      font-size: 15px;
      color: #3f484a;
    }

    .notif-actions {
      display: flex;
      gap: 24px;
      margin-left: 36px;
      margin-top: 8px;
    }

    .notif-action-btn {
      background: transparent;
      border: none;
      color: #006874;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .notif-action-btn:active {
      opacity: 0.6;
    }

    .notification-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(255,255,255,.58);
      font-size: 15px;
      min-height: 200px;
    }

    .empty-icon {
      width: 58px;
      height: 58px;
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 27px;
    }

    .notification-zone {
      position: fixed;
      z-index: 30;
      top: 0;
      left: 0;
      right: 0;
      height: var(--top);
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .notification-zone.hidden {
      display: none;
    }

    .drawer-open .content,
    .drawer-open .dock,
    .drawer-open .navigation {
      filter: brightness(.72);
      transition: filter .28s ease;
    }

    /* Zone centrale */
    .content {
      position: absolute;
      inset: var(--top) 0 var(--bottom) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding-bottom: 104px; /* place pour le dock */
      z-index: 1;
    }

    /* Horloge numérique minimaliste style Android */
    .digital-clock-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .time-display {
      font-size: 110px;
      font-weight: 300;
      color: #1aae09;
      line-height: 0.9;
      letter-spacing: -3px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .date-display {
      font-size: 22px;
      font-weight: 400;
      color: #ffffff;
      margin-top: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* Grille d'applications */
    .apps-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px 32px;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }

    .app img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 16px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.45));
      transition: transform .15s ease;
    }

    .app:active img {
      transform: scale(0.92);
    }

    .app-name {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,.75);
    }

    /* Dock (widget Android) */
    .dock {
      position: fixed;
      left: 50%;
      bottom: calc(var(--bottom) + 14px);
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100% - 24px);
      padding: 10px 14px;
      border-radius: 34px;
      background: rgba(28, 32, 38, 0.62);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }
    .dock-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 64px;
      padding: 0 0 10px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .dock-item img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 14px;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.45));
      transition: transform 0.15s ease;
    }
    .dock-item:active img { transform: scale(0.88); }
    .dock-item:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
    .dock-dot {
      position: absolute;
      bottom: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .dock-item.running .dock-dot { opacity: 0.9; transform: scale(1); }

    /* Iframe d'exécution */
    .drawer-open .app-window { pointer-events: none; }

    /* Application native (Paramètres, Termux, Termux XWayland) : toujours plein écran */
    .app-window {
      position: fixed;
      top: var(--top);
      left: 0;
      right: 0;
      bottom: var(--bottom);
      z-index: 10;
      display: none;
      flex-direction: column;
      background: #303030;
      overflow: hidden;
    }
    .app-iframe {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
      display: block;
      background: #303030;
    }
    .win-bar, .win-shield, .win-resize { display: none; }

    /* Fenêtre de forme libre : uniquement pour les applications X11 (Firefox, Fichiers…) */
    .app-window.floating { background: #f6f5f4; }
    .app-window.floating:not(.maximized) {
      top: var(--y);
      left: var(--x);
      right: auto;
      bottom: auto;
      width: var(--w);
      height: var(--h);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
    }
    .app-window.floating .win-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 36px;
      flex-shrink: 0;
      padding: 0 6px 0 12px;
      background: #202226;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .app-window.floating.focused .win-bar { background: #2c3138; }
    .app-window.floating.maximized .win-bar { cursor: default; }
    .win-title {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #e8eaed;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .win-title img { width: 18px; height: 18px; object-fit: contain; }
    .win-btn {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #e8eaed;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }
    .win-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .win-btn.close:hover { background: #d93025; }
    .x11-body {
      flex: 1;
      min-height: 0;
      display: flex;
      background: #f6f5f4;
    }
    .x11-body img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .app-window.floating:not(.focused) .win-shield {
      display: block;
      position: absolute;
      left: 0;
      right: 0;
      top: 36px;
      bottom: 0;
      z-index: 2;
    }
    .app-window.floating:not(.maximized) .win-resize {
      display: block;
      position: absolute;
      right: 0;
      bottom: 0;
      width: 22px;
      height: 22px;
      z-index: 3;
      cursor: nwse-resize;
      touch-action: none;
      background: linear-gradient(135deg, transparent 52%, rgba(0,0,0,.35) 52%, rgba(0,0,0,.35) 62%,
                  transparent 62%, transparent 72%, rgba(0,0,0,.35) 72%, rgba(0,0,0,.35) 82%, transparent 82%);
    }

    .recents-overlay {
      position: fixed;
      top: var(--top);
      left: 0;
      right: 0;
      bottom: var(--bottom);
      overflow-x: auto;
      background: rgba(10, 14, 18, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: safe center;
      gap: 20px;
      padding: 20px;
    }

    .recents-overlay.open {
      display: flex;
    }

    .recent-card {
      flex-shrink: 0;
      width: 170px;
      height: 270px;
      background: rgba(30, 35, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .recent-card:active {
      transform: scale(0.96);
    }

    .recent-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .recent-card-header img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .recent-card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-card-preview {
      flex: 1;
      width: 100%;
      margin: 10px 0;
      background: #303030;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .recent-card-close {
      background: rgba(255, 255, 255, 0.12);
      border: 0;
      color: #fff;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }

    .recent-card-close:active {
      background: rgba(255, 80, 80, 0.4);
    }

    /* Barre de navigation */
    .navigation {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--bottom);
      padding: 0 9%;
      padding-bottom: env(safe-area-inset-bottom);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, .12);
      z-index: 30;
    }

    .nav-button {
      width: 52px;
      height: 52px;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .back-icon {
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 20px solid #fff;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.25));
    }

    .home-icon {
      width: 23px;
      height: 23px;
      background: #fff;
      border-radius: 50%;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.25));
    }

    .recent-icon {
      width: 21px;
      height: 21px;
      background: #fff;
      border-radius: 3px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.25));
    }

    .nav-button:active {
      transform: scale(.88);
    }

    @media (max-height: 650px) {
      .content { gap: 14px; padding-bottom: 88px; }
      .time-display { font-size: 80px; }
      .app img { width: 56px; height: 56px; }
      .app-name { font-size: 14px; }
      :root { --bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
      .dock { bottom: calc(var(--bottom) + 10px); padding: 8px 12px; }
      .dock-item img { width: 44px; height: 44px; }
      .dock-item { width: 56px; }
    }
  </style>
</head>
<body>

  <!-- Tiroir de notifications -->
  <section class="notification-drawer" id="notificationDrawer" aria-label="Tiroir de notifications">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <span id="drawerTime">00:00</span>
      <span class="drawer-title">Notifications</span>
      <button class="close-drawer" id="closeDrawer" aria-label="Fermer">×</button>
    </div>

    <!-- Notification Termux -->
    <div class="notification-card" id="notifTermux" style="display: none;">
      <div class="notif-header">
        <div class="notif-app-info">
          <div class="notif-icon">&gt;_</div>
          <span>Termux</span>
        </div>
        <div class="notif-chevron">^</div>
      </div>
      <div class="notif-body">
        <div class="notif-title">Termux</div>
        <div class="notif-sub">1 session</div>
      </div>
      <div class="notif-actions">
        <button class="notif-action-btn" id="notifExit">Exit</button>
        <button class="notif-action-btn" id="notifWakelock">Acquire wakelock</button>
      </div>
    </div>

    <!-- État vide -->
    <div class="notification-empty" id="notificationEmpty">
      <div class="empty-icon">✓</div>
      <div>Aucune notification</div>
    </div>
  </section>

  <button class="notification-zone" id="notificationZone"
          aria-label="Ouvrir le tiroir de notifications"></button>

  <!-- Écran d'accueil -->
  <main class="content">
    
    <!-- Horloge numérique moderne -->
    <div class="digital-clock-widget">
      <div class="time-display" id="digitalTime">00:00</div>
      <div class="date-display" id="digitalDate">dim. 6 sept.</div>
    </div>

    <!-- Icônes des applications -->
    <div class="apps-container">
      <div class="app" id="btnXWayland" role="button" tabindex="0">
        <img src="./com.termux.wayland/ic_launcher.webp"
             alt="Icône Termux XWayland"
             onerror="this.style.opacity='.25'">
        <div class="app-name">Termux XWayland</div>
      </div>
      
      <div class="app" id="btnSettings" role="button" tabindex="0">
        <img src="./com.android.settings/ic_lancher.png"
             alt="Icône Settings"
             onerror="this.style.opacity='.25'">
        <div class="app-name" id="labelSettings">Settings</div>
      </div>

      <div class="app" id="btnTermux" role="button" tabindex="0">
        <img src="./com.termux/ic_launcher.png"
             alt="Icône Termux"
             onerror="this.style.opacity='.25'">
        <div class="app-name" id="labelTermux">Termux</div>
      </div>
    </div>
  </main>

  <!-- Dock (widget Android) : visible uniquement sur l'écran d'accueil -->
  <div class="dock" id="dock" role="toolbar" aria-label="Dock">
    <button class="dock-item" data-app="xwayland" aria-label="Termux XWayland" title="Termux XWayland">
      <img src="./com.termux.wayland/ic_launcher.webp" alt="" onerror="this.style.opacity='.25'">
      <span class="dock-dot"></span>
    </button>
    <button class="dock-item" data-app="termux" aria-label="Termux" title="Termux">
      <img src="./com.termux/ic_launcher.png" alt="" onerror="this.style.opacity='.25'">
      <span class="dock-dot"></span>
    </button>
    <button class="dock-item" data-app="settings" aria-label="Settings" title="Settings">
      <img src="./com.android.settings/ic_lancher.png" alt="" onerror="this.style.opacity='.25'">
      <span class="dock-dot"></span>
    </button>
  </div>

  <!-- Les iframes des applications sont créées dynamiquement (une par application) -->

  <!-- Vue des applications récentes -->
  <div class="recents-overlay" id="recentsOverlay">
    <div class="recent-card" id="cardXWayland" style="display: none;">
      <div class="recent-card-header">
        <img src="./com.termux.wayland/ic_launcher.webp" alt="">
        <span class="recent-card-title">Termux XWayland</span>
      </div>
      <div class="recent-card-preview">En cours</div>
      <button class="recent-card-close" id="closeXWayland">Fermer</button>
    </div>

    <div class="recent-card" id="cardTermux" style="display: none;">
      <div class="recent-card-header">
        <img src="./com.termux/ic_launcher.png" alt="">
        <span class="recent-card-title">Termux</span>
      </div>
      <div class="recent-card-preview">En cours</div>
      <button class="recent-card-close" id="closeTermux">Fermer</button>
    </div>
    
    <div class="recent-card" id="cardSettings" style="display: none;">
      <div class="recent-card-header">
        <img src="./com.android.settings/ic_lancher.png" alt="">
        <span class="recent-card-title">Settings</span>
      </div>
      <div class="recent-card-preview">En cours</div>
      <button class="recent-card-close" id="closeSettings">Fermer</button>
    </div>

    <div id="noRecentsMsg" style="color: rgba(255,255,255,0.6); font-size: 15px; display: none;">
      Aucune application récente
    </div>
  </div>

  <!-- Barre de navigation Android -->
  <nav class="navigation" aria-label="Navigation système">
    <button class="nav-button" aria-label="Retour" id="navBack">
      <span class="back-icon"></span>
    </button>

    <button class="nav-button" aria-label="Accueil" id="navHome">
      <span class="home-icon"></span>
    </button>

    <button class="nav-button" aria-label="Applications récentes" id="navRecent">
      <span class="recent-icon"></span>
    </button>
  </nav>

  <script>
    const drawer = document.getElementById("notificationDrawer");
    const notificationZone = document.getElementById("notificationZone");
    const closeDrawer = document.getElementById("closeDrawer");
    const drawerTime = document.getElementById("drawerTime");

    const notifTermux = document.getElementById("notifTermux");
    const notificationEmpty = document.getElementById("notificationEmpty");
    const notifExit = document.getElementById("notifExit");
    const notifWakelock = document.getElementById("notifWakelock");

    const dock = document.getElementById("dock");
    const dockItems = document.querySelectorAll(".dock-item");
    const btnXWayland = document.getElementById("btnXWayland");
    const btnTermux = document.getElementById("btnTermux");
    const btnSettings = document.getElementById("btnSettings");

    const recentsOverlay = document.getElementById("recentsOverlay");
    const noRecentsMsg = document.getElementById("noRecentsMsg");
    const navBack = document.getElementById("navBack");
    const navHome = document.getElementById("navHome");
    const navRecent = document.getElementById("navRecent");
    const navigationBar = document.querySelector(".navigation");

    // Applications natives : toujours en plein écran
    const APPS = {
      xwayland: { title: "Termux XWayland", url: "./com.termux.wayland/AndroidManifest.html",
                  card: document.getElementById("cardXWayland"), close: document.getElementById("closeXWayland") },
      termux:   { title: "Termux", url: "./com.termux/AndroidManifest.html",
                  card: document.getElementById("cardTermux"), close: document.getElementById("closeTermux") },
      settings: { title: "Paramètres", url: "./com.android.settings/AndroidManifest.html",
                  card: document.getElementById("cardSettings"), close: document.getElementById("closeSettings") }
    };

    // Applications X11 : s'ouvrent en fenêtre de forme libre (capture d'écran de la fenêtre)
    const X11_APPS = {
      firefox:     { title: "Firefox", icon: "./com.termux/firefox.png",
                     shot: "./com.termux.wayland/firefox.png", w: 1523, h: 1554 },
      nautilus:    { title: "Fichiers", icon: "./com.termux/nautilus.png",
                     shot: "./com.termux.wayland/nautilus.png", w: 2261, h: 1539 },
      trash:       { title: "Corbeille", icon: "./com.termux/trash.png",
                     shot: "./com.termux.wayland/nautilus%3Atrash.png", w: 2273, h: 1534 },
      libreoffice: { title: "LibreOffice", icon: "./com.termux/libreoffice-main.png",
                     shot: "./com.termux.wayland/libreoffice-main.png", w: 1539, h: 1553 },
      editor:      { title: "Éditeur de texte", icon: "./com.termux/text-editor.png",
                     shot: "./com.termux.wayland/text-editor.png", w: 1386, h: 1077 }
    };
    const hasOwn = (o, k) => typeof k === "string" && Object.prototype.hasOwnProperty.call(o, k);

    // État des applications
    const openApps = { xwayland: false, termux: false, settings: false };
    const wins = {};      // apps natives ("termux"…) et fenêtres X11 ("x11:firefox"…)
    const shown = {};     // fenêtre affichée (non réduite)
    const xorder = [];    // empilement des fenêtres X11, la dernière est au premier plan
    let activeApp = null; // application native plein écran au premier plan
    let activeX = null;   // fenêtre X11 qui a le focus
    let wakelockAcquired = false;
    const x11 = { started: false };   // session Wayland démarrée par "wayland --start"

    /* ===== Réglages écrits par l'app Paramètres (postMessage) ===== */
    const settings = { devUnlocked: false, devOn: false, usbDebug: false, stayAwake: false, freeform: false };
    const SETTING_KEYS = Object.keys(settings);

    function loadSettings() {
      try {
        const s = JSON.parse(localStorage.getItem("tw_settings") || "{}");
        SETTING_KEYS.forEach(k => { if (typeof s[k] === "boolean") settings[k] = s[k]; });
      } catch (e) { /* stockage indisponible */ }
    }

    function saveSettings() {
      try { localStorage.setItem("tw_settings", JSON.stringify(settings)); } catch (e) {}
    }

    const freeformOn = () => settings.devOn && settings.freeform;

    /* ===== Session Wayland / applications X11 ===== */
    function x11State() { return { started: x11.started, freeform: freeformOn() }; }

    function broadcastX11() {
      const w = wins.xwayland;
      if (w && w.frame.contentWindow) {
        w.frame.contentWindow.postMessage({ type: "tw-x11-state", state: x11State() }, "*");
      }
    }

    function x11Request(d) {
      if (d.action === "start") {
        const already = x11.started;
        x11.started = true;
        if (!already) broadcastX11();
        return { ok: true, already: already };
      }
      if (d.action === "launch") {
        if (!hasOwn(X11_APPS, d.app)) return { ok: false, code: "unknown-app" };
        if (!x11.started) return { ok: false, code: "no-session" };
        if (!freeformOn()) return { ok: false, code: "no-freeform" };
        openX11(d.app);
        return { ok: true };
      }
      return { ok: false, code: "bad-request" };
    }

    function endSession() {
      x11.started = false;
      closeAllX();
      broadcastX11();
    }

    // Réglage modifié : sans "fenêtres de forme libre", aucune fenêtre X11 ne peut rester ouverte
    function applyMode() {
      if (!freeformOn()) closeAllX();
      broadcastX11();
    }

    window.addEventListener("message", (e) => {
      // On identifie l'application émettrice : seules nos propres iframes sont écoutées
      const src = Object.keys(wins).find(k => wins[k].frame && wins[k].frame.contentWindow === e.source);
      if (!src) return;
      const d = e.data;
      if (!d || typeof d !== "object") return;

      if (src === "settings") {
        if (d.type === "tw-settings-get") {
          e.source.postMessage({ type: "tw-settings-state", state: settings }, "*");
        } else if (d.type === "tw-settings-set" && d.state && typeof d.state === "object") {
          SETTING_KEYS.forEach(k => { if (typeof d.state[k] === "boolean") settings[k] = d.state[k]; });
          saveSettings();
          applyMode();
        }
      } else if (src === "termux" || src === "xwayland") {
        if (d.type === "tw-x11-get") {
          e.source.postMessage({ type: "tw-x11-state", state: x11State() }, "*");
        } else if (d.type === "tw-x11") {
          const res = x11Request(d);
          e.source.postMessage(Object.assign({ type: "tw-x11-result", id: d.id }, res), "*");
        }
      }
    });

    /* ===== Fenêtres ===== */
    const BAR_H = 36;
    const clamp = (v, min, max) => Math.max(min, Math.min(v, Math.max(min, max)));

    function region() {
      const top = notificationZone.getBoundingClientRect().height;
      const nav = navigationBar.getBoundingClientRect().height;
      return { top: top, width: window.innerWidth, height: window.innerHeight - top - nav };
    }

    // Les fenêtres X11 gardent le ratio de leur capture d'écran
    function clampWin(win) {
      const r = region();
      const maxW = Math.min(r.width, (r.height - BAR_H) * win.aspect);
      win.w = clamp(win.w, Math.min(240, maxW), maxW);
      win.h = Math.round(win.w / win.aspect) + BAR_H;
      win.x = clamp(win.x, 0, r.width - win.w);
      win.y = clamp(win.y, r.top, r.top + r.height - win.h);
    }

    function applyGeom(win) {
      const s = win.el.style;
      s.setProperty("--x", win.x + "px");
      s.setProperty("--y", win.y + "px");
      s.setProperty("--w", win.w + "px");
      s.setProperty("--h", win.h + "px");
      win.el.classList.toggle("maximized", win.maximized);
    }

    function restackX() {
      xorder.forEach((k, i) => { wins[k].el.style.zIndex = String(12 + i); });
    }

    function renderWindows() {
      const recents = recentsOverlay.classList.contains("open");
      for (const k in wins) {
        const w = wins[k];
        const visible = !recents && shown[k] && (w.kind === "x11" || k === activeApp);
        w.el.style.display = visible ? "flex" : "none";
        if (w.kind === "x11") w.el.classList.toggle("focused", k === activeX);
      }
      dock.style.display = (!recents && !activeApp) ? "flex" : "none";
    }

    function focusX(key) {
      activeX = key;
      shown[key] = true;
      const i = xorder.indexOf(key);
      if (i !== -1) xorder.splice(i, 1);
      xorder.push(key);
      restackX();
      renderWindows();
    }

    function toggleMax(key) {
      wins[key].maximized = !wins[key].maximized;
      applyGeom(wins[key]);
    }

    function closeX(key) {
      if (!wins[key]) return;
      wins[key].el.remove();
      delete wins[key];
      delete shown[key];
      const i = xorder.indexOf(key);
      if (i !== -1) xorder.splice(i, 1);
      if (activeX === key) activeX = xorder.length ? xorder[xorder.length - 1] : null;
      renderWindows();
    }

    function closeAllX() {
      xorder.slice().forEach(closeX);
    }

    // Application native : iframe en plein écran, état conservé tant qu'elle n'est pas fermée
    function ensureWindow(key) {
      if (wins[key]) return wins[key];
      const app = APPS[key];

      const el = document.createElement("div");
      el.className = "app-window";
      el.dataset.app = key;

      const frame = document.createElement("iframe");
      frame.className = "app-iframe";
      frame.title = app.title;
      frame.addEventListener("load", () => bindFrameSwipe(frame));
      frame.src = app.url;
      el.appendChild(frame);
      document.body.appendChild(el);

      wins[key] = { kind: "app", el: el, frame: frame };
      return wins[key];
    }

    // Fenêtre de forme libre pour une application X11
    function openX11(appKey) {
      const key = "x11:" + appKey;
      if (wins[key]) { focusX(key); return; }
      const app = X11_APPS[appKey];

      const el = document.createElement("div");
      el.className = "app-window floating";
      el.dataset.app = key;
      el.innerHTML =
        '<div class="win-bar">' +
          '<div class="win-title"><img alt=""><span></span></div>' +
          '<button class="win-btn" data-act="max" aria-label="Agrandir">&#9633;</button>' +
          '<button class="win-btn close" data-act="close" aria-label="Fermer">&times;</button>' +
        '</div>' +
        '<div class="x11-body"><img alt="" draggable="false" decoding="async"></div>' +
        '<div class="win-shield"></div>' +
        '<div class="win-resize"></div>';
      el.querySelector(".win-title img").src = app.icon;
      el.querySelector(".win-title span").textContent = app.title;
      const shot = el.querySelector(".x11-body img");
      shot.alt = app.title;
      shot.src = app.shot;
      document.body.appendChild(el);

      // Taille initiale (ratio de la capture) et cascade
      const aspect = app.w / app.h;
      const r = region();
      const n = xorder.length;
      const win = {
        kind: "x11", el: el, aspect: aspect, maximized: false,
        w: Math.min(r.width * 0.7, 860, (r.height * 0.88 - BAR_H) * aspect),
        h: 0,
        x: 40 + n * 36,
        y: r.top + 16 + n * 36
      };
      clampWin(win);
      applyGeom(win);
      wins[key] = win;
      xorder.push(key);
      shown[key] = true;
      wireX11(win, key);
      focusX(key);
    }

    function wireX11(win, key) {
      const el = win.el;
      const bar = el.querySelector(".win-bar");
      const handle = el.querySelector(".win-resize");

      // Clic dans une fenêtre sans focus : on lui donne le focus
      el.querySelector(".win-shield").addEventListener("pointerdown", () => focusX(key));

      bar.addEventListener("click", (e) => {
        const b = e.target.closest(".win-btn");
        if (!b) return;
        if (b.dataset.act === "max") toggleMax(key);
        else closeX(key);
      });

      bar.addEventListener("dblclick", (e) => {
        if (!e.target.closest(".win-btn")) toggleMax(key);
      });

      // Déplacement
      bar.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".win-btn")) return;
        focusX(key);
        if (win.maximized) return;
        try { bar.setPointerCapture(e.pointerId); } catch (err) {}
        const sx = e.clientX, sy = e.clientY, ox = win.x, oy = win.y;
        const move = (ev) => {
          win.x = ox + ev.clientX - sx;
          win.y = oy + ev.clientY - sy;
          clampWin(win);
          applyGeom(win);
        };
        const up = () => {
          bar.removeEventListener("pointermove", move);
          bar.removeEventListener("pointerup", up);
          bar.removeEventListener("pointercancel", up);
        };
        bar.addEventListener("pointermove", move);
        bar.addEventListener("pointerup", up);
        bar.addEventListener("pointercancel", up);
      });

      // Redimensionnement (coin inférieur droit, ratio conservé)
      handle.addEventListener("pointerdown", (e) => {
        focusX(key);
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
        const sx = e.clientX, ow = win.w;
        const move = (ev) => {
          win.w = ow + ev.clientX - sx;
          clampWin(win);
          applyGeom(win);
        };
        const up = () => {
          handle.removeEventListener("pointermove", move);
          handle.removeEventListener("pointerup", up);
          handle.removeEventListener("pointercancel", up);
        };
        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", up);
        handle.addEventListener("pointercancel", up);
      });
    }

    window.addEventListener("resize", () => {
      for (const k of xorder) { clampWin(wins[k]); applyGeom(wins[k]); }
    });

    /* ===== Dock, notifications, tiroir ===== */
    function renderDock() {
      dockItems.forEach(el => el.classList.toggle("running", !!openApps[el.dataset.app]));
    }

    dockItems.forEach(el => el.addEventListener("click", () => openApp(el.dataset.app)));

    function updateNotifications() {
      renderDock();
      notifTermux.style.display = openApps.termux ? "flex" : "none";
      notificationEmpty.style.display = openApps.termux ? "none" : "flex";
    }

    function setDrawer(open) {
      drawer.classList.toggle("open", open);
      document.body.classList.toggle("drawer-open", open);
      notificationZone.classList.toggle("hidden", open);
    }

    notificationZone.addEventListener("click", () => setDrawer(true));
    closeDrawer.addEventListener("click", () => setDrawer(false));

    /* ===== Cycle de vie des apps natives ===== */
    function showApp(key) {
      recentsOverlay.classList.remove("open");
      setDrawer(false);
      activeApp = key;
      activeX = null;
      shown[key] = true;
      renderWindows();
    }

    function openApp(key) {
      openApps[key] = true;
      ensureWindow(key);
      showApp(key);
      updateNotifications();
    }

    function goHome() {
      activeApp = null;
      for (const k in wins) if (wins[k].kind === "app") shown[k] = false;
      recentsOverlay.classList.remove("open");
      renderWindows();
    }

    function leaveRecents() {
      recentsOverlay.classList.remove("open");
      renderWindows();
    }

    function closeAppTask(key) {
      openApps[key] = false;
      if (wins[key]) {
        wins[key].el.remove();
        delete wins[key];
      }
      delete shown[key];
      if (activeApp === key) activeApp = null;

      if (key === "termux") {
        wakelockAcquired = false;
        notifWakelock.textContent = "Acquire wakelock";
        endSession();   // fermer Termux arrête la session Wayland et ses fenêtres
      }

      renderWindows();
      renderRecents();
      updateNotifications();
    }

    function renderRecents() {
      let any = false;
      for (const key in APPS) {
        APPS[key].card.style.display = openApps[key] ? "flex" : "none";
        if (openApps[key]) any = true;
      }
      noRecentsMsg.style.display = any ? "none" : "block";
    }

    // Actions dans la notification Termux
    notifExit.addEventListener("click", () => closeAppTask("termux"));

    notifWakelock.addEventListener("click", () => {
      wakelockAcquired = !wakelockAcquired;
      notifWakelock.textContent = wakelockAcquired ? "Release wakelock" : "Acquire wakelock";
    });

    // Lancement des applications (icônes de l'accueil)
    btnXWayland.addEventListener("click", () => openApp("xwayland"));
    btnSettings.addEventListener("click", () => openApp("settings"));
    btnTermux.addEventListener("click", () => openApp("termux"));

    // Accessibilité clavier pour les icônes
    document.querySelectorAll(".app[role='button']").forEach(el => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
      });
    });

    // Cartes des récents : basculer vers l'app / fermer la tâche
    for (const key in APPS) {
      APPS[key].card.addEventListener("click", (e) => {
        if (e.target.classList.contains("recent-card-close")) return;
        showApp(key);
      });
      APPS[key].close.addEventListener("click", (e) => {
        e.stopPropagation();
        closeAppTask(key);
      });
    }

    // Bouton de navigation : Applications récentes
    navRecent.addEventListener("click", () => {
      if (recentsOverlay.classList.contains("open")) {
        leaveRecents();
      } else {
        renderRecents();
        recentsOverlay.classList.add("open");
        renderWindows();
      }
    });

    // Bouton de navigation : Retour
    navBack.addEventListener("click", () => {
      if (recentsOverlay.classList.contains("open")) {
        leaveRecents();
      } else if (activeApp) {
        goHome();
      } else if (xorder.length) {
        closeX(xorder[xorder.length - 1]);   // ferme la fenêtre X11 au premier plan
      }
    });

    // Bouton de navigation : Accueil
    navHome.addEventListener("click", () => {
      setDrawer(false);
      goHome();
    });

    /* ===== Glissement du tiroir ===== */
    // Départ dans les 70 px du haut (coordonnées écran)
    function handleSwipe(startY, endY) {
      const delta = endY - startY;
      if (!drawer.classList.contains("open") && startY < 70 && delta > 70) {
        setDrawer(true);
      } else if (drawer.classList.contains("open") && delta < -70) {
        setDrawer(false);
      }
    }

    let touchStartY = null;

    document.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      if (touchStartY === null || e.changedTouches.length !== 1) return;
      handleSwipe(touchStartY, e.changedTouches[0].clientY);
      touchStartY = null;
    }, { passive: true });

    // L'iframe capte les touches : on relaie le geste depuis son document
    // (possible si même origine ; sinon seule la barre d'état déclenche le tiroir).
    function bindFrameSwipe(f) {
      try {
        const doc = f.contentDocument;
        if (!doc) return;
        const offset = () => f.getBoundingClientRect().top;
        let y0 = null;
        doc.addEventListener("touchstart", (e) => {
          if (e.touches.length === 1) y0 = e.touches[0].clientY + offset();
        }, { passive: true });
        doc.addEventListener("touchend", (e) => {
          if (y0 === null || e.changedTouches.length !== 1) return;
          handleSwipe(y0, e.changedTouches[0].clientY + offset());
          y0 = null;
        }, { passive: true });
      } catch (err) {
        /* iframe d'une autre origine (ex. file:// sous Chrome) : ignoré */
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        setDrawer(false);
        if (recentsOverlay.classList.contains("open")) leaveRecents();
      }
    });

    /* ===== Horloge ===== */
    function updateClock() {
      const now = new Date();

      // Heure dynamique au format HH:MM
      const timeText = [now.getHours(), now.getMinutes()].map(v => String(v).padStart(2, "0")).join(":");
      document.getElementById("digitalTime").textContent = timeText;
      drawerTime.textContent = timeText;

      // Date dynamique en anglais
      const options = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById("digitalDate").textContent = now.toLocaleDateString('en-US', options);
    }

    loadSettings();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
